<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const PAGES = ["g1.html","g2.html","g3.html","index.html"];
const keyCache = {};
async function deriveKey(pw, saltB64){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(saltB64), iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function unlockPayload(pw, p){
  const key = await deriveKey(pw, p.salt);
  keyCache[p.salt] = key;
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(p.iv)}, key, b64(p.data));
  return new TextDecoder().decode(pt);
}
async function unlock(pw){
  const p = JSON.parse(document.getElementById('payload').textContent);
  return unlockPayload(pw, p);
}
async function show(html){ document.open(); document.write(html); document.close(); }

/* ---------- wiki search (runs after unlock) ---------- */
async function cachedKey(pw, saltB64){
  if(!keyCache[saltB64]) keyCache[saltB64] = await deriveKey(pw, saltB64);
  return keyCache[saltB64];
}
let searchIdx = null, indexingPromise = null;
async function buildIndex(pw){
  if(searchIdx) return searchIdx;
  if(indexingPromise) return indexingPromise;
  indexingPromise = (async () => {
    const out = [];
    for(const file of PAGES){
      try{
        const txt = await (await fetch(file)).text();
        const m = txt.match(/<script id="payload" type="application\/json">([\s\S]*?)<\/script>/);
        if(!m) continue;
        const p = JSON.parse(m[1]);
        const key = await cachedKey(pw, p.salt);
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(p.iv)}, key, b64(p.data));
        const html = new TextDecoder().decode(pt);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const title = (((doc.querySelector('title')||{}).textContent)||file).trim();
        const text = (((doc.body||{}).textContent)||'').replace(/\s+/g,' ').trim();
        if(text) out.push({file, title, text, twords: wordsOf(title), bwords: wordsOf(text)});
      }catch(e){/* skip pages that fail to load or decrypt */}
    }
    searchIdx = out;
    return out;
  })();
  return indexingPromise;
}
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const escH = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* synonyms + word variants: IT helpdesk vocabulary, matched at reduced weight */
const SYN_GROUPS = [
  ['wifi','wireless','wlan'],
  ['laptop','notebook'],
  ['desktop','pc','computer'],
  ['password','passwd','passcode','credentials'],
  ['login','log-in','signin','sign-in','logon'],
  ['account','profile'],
  ['email','mail','outlook'],
  ['printer','print','printing'],
  ['internet','network','connectivity','connection','online'],
  ['vpn','virtual private network'],
  ['reboot','restart'],
  ['shutdown','shut down','power off'],
  ['monitor','screen','display'],
  ['keyboard','keys'],
  ['slow','laggy','lag','freeze','frozen','hang','hanging','unresponsive'],
  ['crash','crashed','crashing','bsod','blue screen'],
  ['ticket','servicenow','incident','request'],
  ['escalate','escalation','escalating','escalated'],
  ['software','app','application','program'],
  ['install','installation','setup'],
  ['update','upgrade','patch'],
  ['backup','back up'],
  ['browser','chrome','edge','firefox'],
  ['phone','mobile','cell'],
  ['projector','av'],
  ['virus','malware','antivirus']
];
const SYN_MAP = {};
SYN_GROUPS.forEach(g => g.forEach(w => {
  const k = norm(w).split(' ')[0];
  SYN_MAP[k] = SYN_MAP[k] || [];
  g.forEach(x => { if(x !== w && !SYN_MAP[k].includes(x)) SYN_MAP[k].push(x); });
}));
function base(w){
  w = norm(w);
  if(w.length > 4 && w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.length > 4 && /(s|x|z|ch|sh)es$/.test(w)) return w.slice(0,-2);
  if(w.length > 3 && w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) return w.slice(0,-1);
  return w;
}
function wordsOf(s){ return norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>1).map(base); }
function wordHit(words, bv){
  for(const w of words) if(w === bv) return 2;
  for(const w of words){ if(w.startsWith(bv) || (bv.length > 3 && w.includes(bv))) return 1; }
  return 0;
}
function variantHit(pg, v){
  const nv = norm(v), tn = norm(pg.title), bn = norm(pg.text);
  if(nv.includes(' ')) return { t: tn.includes(nv) ? 2 : 0, b: bn.includes(nv) ? 2 : 0, bpos: bn.indexOf(nv) };
  const bv = base(nv);
  return { t: wordHit(pg.twords, bv), b: wordHit(pg.bwords, bv), bpos: bn.indexOf(nv) };
}
function rankSearch(q){
  const terms = norm(q).split(/\s+/).filter(t=>t.length>1);
  const hits = [];
  if(!terms.length || !searchIdx) return hits;
  for(const pg of searchIdx){
    let score = 0, ok = true, first = -1;
    for(const term of terms){
      const variants = [{v:term, syn:false}].concat((SYN_MAP[term]||[]).map(s => ({v:s, syn:true})));
      let best = 0, bpos = -1;
      for(const {v, syn} of variants){
        const h = variantHit(pg, v);
        const w = syn ? 0.5 : 1;
        if(h.t) best = Math.max(best, (h.t === 2 ? 12 : 6) * w);
        if(h.b){
          if(h.bpos >= 0 && bpos < 0) bpos = h.bpos;
          best = Math.max(best, ((h.b === 2 ? 4 : 2) * w) + 0.5);
        }
      }
      if(!best){ ok = false; break; }
      score += best;
      if(bpos >= 0 && first < 0) first = bpos;
    }
    if(ok) hits.push({pg, score, first});
  }
  return hits.sort((a,b)=>b.score-a.score).slice(0,10);
}
function makeSnippet(pg, q, pos){
  const text = pg.text;
  const start = Math.max(0, pos-70), end = Math.min(text.length, pos+90);
  let s = escH((start>0?'…':'') + text.slice(start,end) + (end<text.length?'…':''));
  for(const term of norm(q).split(/\s+/).filter(t=>t.length>1)){
    s = s.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>');
  }
  return s;
}
function initSearch(pw){
  const css = [
    '#wsk-btn{position:fixed;right:1.1rem;bottom:1.1rem;z-index:2147483646;width:3rem;height:3rem;border-radius:50%;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}',
    '#wsk-btn:hover{border-color:#1f6feb}',
    '#wsk-ov{position:fixed;inset:0;z-index:2147483647;background:rgba(1,4,9,.72);display:flex;justify-content:center;align-items:flex-start;padding:12vh 1rem 1rem}',
    '#wsk-ov[hidden]{display:none}',
    '#wsk-box{width:min(94vw,620px);background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6)}',
    '#wsk-in{width:100%;background:#0d1117;border:0;border-bottom:1px solid #30363d;color:#e6edf3;font-size:1.05rem;padding:.9rem 1.1rem;outline:none}',
    '#wsk-res{max-height:46vh;overflow:auto}',
    '.wsk-it{display:block;padding:.7rem 1.1rem;text-decoration:none;border-bottom:1px solid #21262d}',
    '.wsk-it.on,.wsk-it:hover{background:#1c2330}',
    '.wsk-t{color:#79c0ff;font-weight:600;font-size:.95rem;margin-bottom:.15rem}',
    '.wsk-s{color:#8b949e;font-size:.85rem;line-height:1.45}',
    '.wsk-s mark{background:#9e6a03;color:#fff;border-radius:3px;padding:0 2px}',
    '.wsk-meta{padding:1rem 1.1rem;color:#6e7681;font-size:.88rem}',
    '#wsk-hint{padding:.55rem 1.1rem;color:#6e7681;font-size:.75rem;border-top:1px solid #21262d}'
  ].join('');
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const btn = document.createElement('button'); btn.id='wsk-btn'; btn.type='button'; btn.title='Search the wiki ( / )'; btn.textContent='🔍';
  const ov = document.createElement('div'); ov.id='wsk-ov'; ov.hidden = true;
  ov.innerHTML = '<div id="wsk-box" role="dialog" aria-label="Wiki search"><input id="wsk-in" type="text" placeholder="Search the wiki…" autocomplete="off" aria-label="Search the wiki"><div id="wsk-res"></div><div id="wsk-hint"><b>/</b> or <b>Ctrl+K</b> to search · <b>↑↓</b> to move · <b>Enter</b> to open · <b>Esc</b> to close</div></div>';
  document.body.appendChild(btn); document.body.appendChild(ov);
  const inp = ov.querySelector('#wsk-in'), res = ov.querySelector('#wsk-res');
  let items = [], sel = -1, timer = null, opened = false;
  async function ensureIdx(){
    if(searchIdx) return;
    res.innerHTML = '<div class="wsk-meta">Reading pages…</div>';
    await buildIndex(pw);
  }
  async function run(){
    const q = inp.value.trim();
    if(q.length < 2){ items=[]; res.innerHTML=''; return; }
    await ensureIdx();
    if(!searchIdx.length){ res.innerHTML = '<div class="wsk-meta">Couldn\'t read any pages.</div>'; return; }
    items = rankSearch(q); sel = items.length ? 0 : -1;
    if(!items.length){ res.innerHTML = '<div class="wsk-meta">No matches. Try fewer or different words.</div>'; return; }
    res.innerHTML = items.map((r,i)=>{
      const sn = r.first>=0 ? makeSnippet(r.pg, q, r.first) : escH(r.pg.text.slice(0,140));
      return '<a class="wsk-it'+(i===sel?' on':'')+'" href="'+r.pg.file+'"><div class="wsk-t">'+escH(r.pg.title)+'</div><div class="wsk-s">'+sn+'</div></a>';
    }).join('');
  }
  function paintSel(){
    const els = res.querySelectorAll('.wsk-it');
    for(let i=0;i<els.length;i++) els[i].classList.toggle('on', i===sel);
  }
  function open(){ ov.hidden=false; opened=true; setTimeout(()=>inp.focus(),0); }
  function close(){ ov.hidden=true; opened=false; }
  btn.addEventListener('click', open);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  inp.addEventListener('input', ()=>{ clearTimeout(timer); timer=setTimeout(run, 160); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='Escape') close();
    else if(e.key==='ArrowDown' && items.length){ e.preventDefault(); sel=(sel+1)%items.length; paintSel(); }
    else if(e.key==='ArrowUp' && items.length){ e.preventDefault(); sel=(sel-1+items.length)%items.length; paintSel(); }
    else if(e.key==='Enter' && sel>=0 && items[sel]){ location.href = items[sel].pg.file; }
  });
  document.addEventListener('keydown', e=>{
    const tag = (document.activeElement&&document.activeElement.tagName)||'';
    if((e.key==='/' && !opened && tag!=='INPUT' && tag!=='TEXTAREA') || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k')){ e.preventDefault(); open(); }
    else if(e.key==='Escape' && opened) close();
  });
  setTimeout(()=>{ buildIndex(pw).catch(()=>{}); }, 700);
}

async function tryPw(pw, silent){
  try { const html = await unlock(pw); sessionStorage.setItem('deskwiki', pw); await show(html); initSearch(pw); return true; }
  catch(e){ if(!silent) document.getElementById('err').hidden = false; return false; }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); document.getElementById('err').hidden = true; tryPw(document.getElementById('pw').value, false); });
(async () => { const saved = sessionStorage.getItem('deskwiki'); if (saved) { const ok = await tryPw(saved, true); if (!ok) sessionStorage.removeItem('deskwiki'); } })();
</script>
